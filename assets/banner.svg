<svg
  width="854"
  height="200"
  xmlns="http://www.w3.org/2000/svg"
  style="z-index:1;position:relative"
  viewBox="0 0 854 200"
>
  <style>
    .text {
      font-size: 70px;
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Helvetica, Arial, sans-serif;
      letter-spacing: -1.5px;
      animation: fadeIn 1.2s ease-in-out forwards;
    }

    .desc {
      font-size: 20px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Helvetica, Arial, sans-serif;
      letter-spacing: 0.3px;
      animation: fadeIn 1.5s ease-in-out forwards;
    }

    .glow {
      animation: glowPulse 4s ease-in-out infinite;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glowPulse {
      0%, 100% {
        opacity: 0.18;
      }
      50% {
        opacity: 0.35;
      }
    }
  </style>

  <defs>

    <!-- Main red gradient -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Dark red gradient -->
    <linearGradient id="darkRedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Subtle glow -->
    <radialGradient id="redGlow">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="8"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>

  </defs>

  <!-- Dark premium background -->
  <rect
    width="854"
    height="200"
    rx="2"
    fill="#09090b"
  />

  <!-- Subtle red glow behind title -->
  <ellipse
    class="glow"
    cx="427"
    cy="65"
    rx="330"
    ry="100"
    fill="url(#redGlow)"
  />

  <!-- Main animated wave -->
  <path
    fill="url(#redGradient)"
    opacity="0.78"
    d="M0 0L0 125
       Q213.5 160 427 130
       T854 150
       L854 0Z"
  >
    <animate
      attributeName="d"
      dur="14s"
      repeatCount="indefinite"
      values="
        M0 0L0 125 Q213.5 160 427 130 T854 150 L854 0Z;
        M0 0L0 145 Q213.5 130 427 145 T854 125 L854 0Z;
        M0 0L0 115 Q213.5 175 427 125 T854 155 L854 0Z;
        M0 0L0 125 Q213.5 160 427 130 T854 150 L854 0Z
      "
    />
  </path>

  <!-- Secondary darker wave -->
  <path
    fill="url(#darkRedGradient)"
    opacity="0.65"
    d="M0 0L0 145
       Q213.5 175 427 150
       T854 165
       L854 0Z"
  >
    <animate
      attributeName="d"
      dur="18s"
      repeatCount="indefinite"
      begin="-7s"
      values="
        M0 0L0 145 Q213.5 175 427 150 T854 165 L854 0Z;
        M0 0L0 130 Q213.5 145 427 165 T854 135 L854 0Z;
        M0 0L0 155 Q213.5 125 427 145 T854 155 L854 0Z;
        M0 0L0 145 Q213.5 175 427 150 T854 165 L854 0Z
      "
    />
  </path>

  <!-- Thin highlight wave -->
  <path
    d="M0 151 Q213.5 175 427 148 T854 158"
    fill="none"
    stroke="#f87171"
    stroke-width="1.5"
    opacity="0.35"
  >
    <animate
      attributeName="d"
      dur="12s"
      repeatCount="indefinite"
      values="
        M0 151 Q213.5 175 427 148 T854 158;
        M0 145 Q213.5 155 427 160 T854 145;
        M0 158 Q213.5 140 427 150 T854 165;
        M0 151 Q213.5 175 427 148 T854 158
      "
    />
  </path>

  <!-- Title -->
  <text
    text-anchor="middle"
    dominant-baseline="middle"
    x="50%"
    y="35%"
    class="text"
    fill="#ffffff"
    filter="url(#shadow)"
  >
    Project Solva
  </text>

  <!-- Subtitle -->
  <text
    text-anchor="middle"
    dominant-baseline="middle"
    x="50%"
    y="60%"
    class="desc"
    fill="#ffffff"
  >
    AI-Assisted Data Observability &amp; Auto-Healing Pipeline
  </text>

</svg>
